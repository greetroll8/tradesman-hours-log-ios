workflows:
  ios_simulator_build:
    name: iOS Simulator Build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project TradesmanHoursLog.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  ios_simulator_tests:
    name: iOS Simulator Tests (XCTest)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Run unit tests on Simulator
        script: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [0-9][^(]*\) (.*/\1/p' | head -1 | xargs)
          [ -z "$DEVICE" ] && DEVICE="iPhone 15"
          echo "Using simulator: $DEVICE"
          rm -rf build/test-results.xcresult
          mkdir -p build
          xcodebuild test \
            -project TradesmanHoursLog.xcodeproj \
            -scheme App \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath build/test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild-test.log
    artifacts:
      - build/xcodebuild-test.log
      - build/test-results.xcresult
      - /tmp/xcodebuild_logs/*.log

  ios_testflight:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.greetroll8.tradesmanhourslog
      vars:
        APP_STORE_APPLE_ID: 0000000000
        BUNDLE_ID: com.greetroll8.tradesmanhourslog
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd $CM_BUILD_DIR
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project TradesmanHoursLog.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
