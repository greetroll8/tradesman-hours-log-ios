name: TradesmanHoursLog
options:
  bundleIdPrefix: com.greetroll8
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greetroll8.tradesmanhourslog
        PRODUCT_NAME: TradesmanHoursLog
        PRODUCT_MODULE_NAME: TradesmanHoursLog
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests
      - path: Sources/Models/Models.swift
      - path: Sources/Util/Formatting.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greetroll8.tradesmanhourslog.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  App:
    build:
      targets:
        App: all
        AppTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - AppTests
